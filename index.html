<!doctype html>
<html lang="en" style="background-color: #000000; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        const isSuppressed = (msg) => {
          if (!msg) return false;
          let s = '';
          if (typeof msg === 'string') {
            s = msg;
          } else if (msg instanceof Event) {
            s = (msg.type || '') + ' ' + (msg.target?.tagName || '') + ' ' + (msg.target?.src || '') + ' ' + (msg.message || '');
          } else {
            s = (msg.message || msg.code || msg.stack || msg.name || String(msg));
          }
          const lower = s.toLowerCase();
          return lower.includes('[vite]') ||
                 lower.includes('failed to connect to websocket') ||
                 lower.includes('websocket') ||
                 lower.includes('vite-hmr') ||
                 lower.includes('load failed') ||
                 lower.includes('the string did not match the expected pattern') ||
                 lower.includes('cancelled-popup-request') ||
                 lower.includes('popup-closed-by-user');
        };
        ['error', 'warn', 'info', 'debug', 'log'].forEach(fn => {
          const orig = console[fn];
          console[fn] = function(...args) {
            if (args.some(isSuppressed)) return;
            orig.apply(console, args);
          };
        });
        window.addEventListener('error', function(e) {
          if (isSuppressed(e.message) || isSuppressed(e.filename) || isSuppressed(e.error) || isSuppressed(e)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return false;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isSuppressed(e.reason) || isSuppressed(e)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return false;
          }
        }, true);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TradeSizer" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Crypto Trade Sizer</title>
    <meta name="description" content="Calculate exact crypto position sizes and sync your trade history to the cloud." />
    <meta property="og:title" content="Crypto Trade Sizer" />
    <meta property="og:description" content="Calculate exact crypto position sizes and sync your trade history to the cloud." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

        color-scheme: dark;

      }

        background-color: #000000 !important;

      }
    </style>

</html>
